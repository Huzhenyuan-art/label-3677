<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="hold-transition login-page login-gradient-bg">
<div class="login-box login-box-wide">
    <div class="card card-outline card-primary shadow-lg rounded-lg">
        <div class="card-header text-center border-0 pt-4">
            <a href="#" class="h3 text-dark"><b>智能后台</b>管理系统</a>
            <p class="text-muted mt-2 mb-0">Spring Boot + JWT + AdminLTE</p>
        </div>
        <div class="card-body p-4">
            <form id="login-form" novalidate>
                <div class="input-group mb-3">
                    <input id="username" type="text" class="form-control" placeholder="用户名（默认：admin）" maxlength="64" required>
                    <div class="input-group-append">
                        <div class="input-group-text"><span class="fas fa-user"></span></div>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input id="password" type="password" class="form-control" placeholder="密码（默认：123456）" maxlength="64" required>
                    <div class="input-group-append">
                        <div class="input-group-text"><span class="fas fa-lock"></span></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <button id="login-btn" type="submit" class="btn btn-primary btn-block py-2 font-weight-bold">登录系统</button>
                    </div>
                </div>
                <div id="login-attempt-info" class="login-attempt-info d-none mt-3">
                    <div id="attempt-remaining" class="attempt-remaining"></div>
                    <div id="attempt-countdown" class="attempt-countdown d-none"></div>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="toast-container p-3">
    <div id="appToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-delay="2600">
        <div class="toast-header bg-primary text-white">
            <strong class="mr-auto">系统提示</strong>
            <button type="button" class="ml-2 mb-1 close text-white" data-dismiss="toast" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div id="appToastBody" class="toast-body"></div>
    </div>
</div>

<div id="global-loading" class="global-loading d-none">
    <div class="spinner-border text-light" role="status" aria-label="loading"></div>
</div>

<script src="/assets/vendor/jquery.min.js?v=2026061103"></script>
<script src="/assets/vendor/bootstrap.bundle.min.js?v=2026061103"></script>
<script src="/assets/vendor/adminlte.min.js?v=2026061103"></script>
<script src="/assets/js/common.js?v=2026061103"></script>
<script src="/assets/js/login.js?v=2026061103"></script>
</body>
</html>
