server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index login.html;

    location = / {
        return 302 /login.html;
    }

    location = /login {
        return 302 /login.html$is_args$args;
    }

    location = /index {
        return 302 /index.html$is_args$args;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
    }

    location /admin/ {
        proxy_pass http://backend:8080/admin/;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
