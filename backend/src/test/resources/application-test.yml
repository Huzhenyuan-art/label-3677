server:
  port: 18080

spring:
  application:
    name: admin-system-test
  datasource:
    url: jdbc:h2:mem:admin_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  redis:
    host: localhost
    port: 6379
    timeout: 5s
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  boot:
    admin:
      context-path: /admin

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  token-expire-minutes: 120
  jwt-secret: test_jwt_secret_key_for_testing_purposes_2026
  login:
    max-attempts: 5
    lock-minutes: 10
  startup:
    init-enabled: false

logging:
  level:
    root: WARN
    com.prompt2repo.admin: DEBUG
