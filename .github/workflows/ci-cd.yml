name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & Test
        run: mvn -s settings.xml -B clean verify

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/backend-0.0.1-SNAPSHOT.jar
          retention-days: 5

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 5

  docker-build:
    name: Docker Build & Push
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  health-check:
    name: Integration Health Check
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifact/

      - name: Start services
        env:
          MYSQL_ROOT_PASSWORD: ci_test_pwd
          MYSQL_DATABASE: admin_demo
          JWT_SECRET: ci_test_jwt_secret_key_for_github_actions
          SPRING_PROFILES_ACTIVE: dev
        run: docker compose -f docker-compose.yml up --build -d

      - name: Wait for backend healthy
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 60); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' admin_backend 2>/dev/null || echo "not_found")
            echo "  Attempt $i/60: backend status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Run health endpoint check
        run: |
          RESPONSE=$(curl -sf http://localhost:8080/actuator/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"UP"' || (echo "Health check failed!" && exit 1)

      - name: Run login API check
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"123456"}')
          echo "$RESPONSE" | grep -q '"code":0' || (echo "Login check failed!" && exit 1)
          echo "Login API check passed!"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose logs backend || true
          echo "=== Frontend Logs ==="
          docker compose logs frontend || true
          echo "=== MySQL Logs ==="
          docker compose logs db || true

      - name: Tear down
        if: always()
        run: docker compose down -v
